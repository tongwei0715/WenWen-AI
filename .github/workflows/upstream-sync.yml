name: Upstream Sync

# 每周检查上游 TencentCloud/Octop 的新提交并试合并：
# - 能干净合并 → 跑 branding + make test，验证 fork 可合入
# - 有冲突 → run 标红，冲突文件列表写在日志里
# - 测试挂 → run 标红
# 本 workflow 只检测、不开 PR、不建 issue、不推 main。
# 通知由外部盯哨读取 run 结果后发出。

on:
  schedule:
    # 每周一 09:00 CST (01:00 UTC)
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/TencentCloud/Octop.git 2>/dev/null || true
          git fetch upstream --tags

      - name: Check for new upstream commits
        id: check
        run: |
          NEW=$(git rev-list --count HEAD..upstream/main)
          echo "new_commits=$NEW" >> "$GITHUB_OUTPUT"
          echo "upstream new commits: $NEW"
          if [ "$NEW" != "0" ]; then
            echo "--- upstream commits not in our main ---"
            git log --oneline HEAD..upstream/main | head -40
          fi

      - name: Try merge upstream/main
        id: merge
        if: steps.check.outputs.new_commits != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "sync/upstream-$(date +%Y%m%d)"
          if git merge --no-ff upstream/main -m "chore: merge upstream/main ($(date +%Y-%m-%d))"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "merge clean"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "--- conflicting files ---"
            git diff --name-only --diff-filter=U
            git merge --abort || true
            exit 1
          fi

      - name: Set up uv and Python
        if: steps.merge.outputs.conflict == 'false'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        if: steps.merge.outputs.conflict == 'false'
        run: make install

      - name: Apply WenWen AI branding
        if: steps.merge.outputs.conflict == 'false'
        run: |
          python3 scripts/apply-branding.py
          python3 scripts/apply-branding.py --check

      - name: Run backend tests
        if: steps.merge.outputs.conflict == 'false'
        run: make test
